; Lower saturation with a small exposure lift. All referenced effects are bundled.
Techniques=ColorGrade@ColorGrade.fx,Vibrance@Vibrance.fx
TechniqueSorting=ColorGrade@ColorGrade.fx,Vibrance@Vibrance.fx,LumaSharpen@LumaSharpen.fx,Copy@ColorGrade.fx

[ColorGrade.fx]
Exposure=0.12
Saturation=0.85

[Vibrance.fx]
Vibrance=-0.08
VibranceRGBBalance=1.0,1.0,1.0

[LumaSharpen.fx]
sharp_strength=0.2
sharp_clamp=0.035
pattern=1
offset_bias=1.0
show_sharpen=0
