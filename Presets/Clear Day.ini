; A subtle color and sharpening preset using the bundled effect library.
Techniques=ColorGrade@ColorGrade.fx,Vibrance@Vibrance.fx,LumaSharpen@LumaSharpen.fx
TechniqueSorting=ColorGrade@ColorGrade.fx,Vibrance@Vibrance.fx,LumaSharpen@LumaSharpen.fx,Copy@ColorGrade.fx

[ColorGrade.fx]
Exposure=0.08
Saturation=1.02

[Vibrance.fx]
Vibrance=0.12
VibranceRGBBalance=1.0,1.0,1.0

[LumaSharpen.fx]
sharp_strength=0.35
sharp_clamp=0.035
pattern=1
offset_bias=1.0
show_sharpen=0
